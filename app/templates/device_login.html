<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script src="/static/request-security.js?v=1"></script>
    <title>Đăng xuất · Smart TKB</title>
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <link rel="icon" type="image/svg+xml" href="/static/brand-logo.svg?v=1">
    <link rel="stylesheet" href="/static/design-tokens.css?v=1">
    <link rel="stylesheet" href="/static/style.css?v=11">
    <link rel="stylesheet" href="/static/device-login.css?v=2">
</head>
<body>
    <main class="device-login-shell">
        <section class="device-login-card" aria-labelledby="device-login-title">
            <a class="device-brand" href="/"><img src="/static/brand-logo.svg?v=1" width="36" height="36" alt=""><span>Smart TKB</span></a>
            <div class="device-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5M14 8l4 4-4 4M9 12h10"/></svg></div>
            <h1 id="device-login-title">Đăng xuất khỏi thiết bị này?</h1>
            <p>Bạn có thể đăng nhập lại bất cứ lúc nào. Sau khi đăng xuất, thiết bị này không còn chiếm một phiên hoạt động.</p>
            <form method="post" action="/logout">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button class="btn wide" type="submit">Đăng xuất</button>
            </form>
            <a class="btn ghost wide device-back" href="/">Tiếp tục sử dụng</a>
        </section>
    </main>
</body>
</html>
