<!DOCTYPE html>
<html lang="vi">

<head>
    <link rel="icon" type="image/svg+xml" href="/static/brand-logo.svg?v=1">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ p.name }}</title>
    <script>(function () { const t = localStorage.getItem('theme'); if (t === 'dark') { document.documentElement.classList.add('dark-mode'); } })(); function toggleTheme() { const isDark = document.documentElement.classList.toggle('dark-mode'); localStorage.setItem('theme', isDark ? 'dark' : 'light'); document.querySelectorAll('.theme-switch__checkbox').forEach(cb => cb.checked = isDark); }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/design-tokens.css?v=1">
    <link rel="stylesheet" href="/static/style.css?v=1">
    <script src="/static/operation-status.js?v=1" defer></script>
    <script src="/static/appbar-datetime.js?v=1" defer></script>
    <link rel="stylesheet" href="/static/effects.css?v=1">
    <link rel="stylesheet" href="/static/front.css?v=1">
</head>

<body class="front-surface share-surface">
    <header class="appbar">
        <div class="brand brand-with-logo"><img src="/static/brand-logo.svg?v=1" alt=""><span>Smart TKB · Chế độ chia
                sẻ</span></div>
        <div class="spacer"></div>
        {% include "_theme_switch.html" %}
        <a class="btn ghost" href="/login">Đăng nhập giáo viên</a>
    </header>
    <main class="container">
        <div class="section-head">
            <div>
                <h1>{{ p.name }}</h1>
                <p>{{ p.school_name }}</p>
            </div>
            <div class="row">
                <select id="viewType">
                    <option value="overview" selected>Xem tổng quát</option>
                    <option value="class">Xem theo lớp</option>
                    <option value="teacher">Xem theo giáo viên</option>
                </select>
                <select id="viewEntity"></select>
            </div>
        </div>
        <div id="scheduleGrid"></div>
    </main>
    <script>window.PROJECT_ID = {{ p.id }}; window.INIT_DATA = {{ data | tojson }}; window.READ_ONLY = true;</script>
    <script src="/static/app.js?v=1"></script>
</body>

</html>
