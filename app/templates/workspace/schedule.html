<section id="schedule" class="tab">
    <div class="section-head">
        <div>
            <h1>Xếp và tinh chỉnh</h1>
        </div>
        <div class="row">
            <select id="viewType" aria-label="Kiểu lọc thời khóa biểu">
                <option value="overview" selected>Xem tổng quát</option>
                <option value="grade">Xem theo khối</option>
                <option value="class">Xem theo lớp</option>
                <option value="teacher">Xem theo giáo viên</option>
                <option value="subject">Xem theo môn học</option>
            </select>
            <select id="viewEntity" hidden disabled aria-label="Đối tượng lọc thời khóa biểu"></select>
            <button type="button" id="scheduleFullscreenBtn" class="btn ghost schedule-fullscreen-btn"
                onclick="toggleScheduleFullscreen()" title="Phóng to thời khóa biểu toàn màn hình"
                aria-label="Phóng to thời khóa biểu toàn màn hình" aria-pressed="false">
                <svg class="schedule-fullscreen-expand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg>
                <svg class="schedule-fullscreen-shrink" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h6V3M21 9h-6V3M3 15h6v6M21 15h-6v6"/></svg>
                <span class="schedule-fullscreen-label">Phóng to</span>
            </button>
            <div class="action-feedback-stack">
                <button class="btn schedule-action-btn btn-23" data-schedule-action onclick="generateSchedule()">
                    <span class="schedule-action-stage"><span class="schedule-action-content"><span
                                class="schedule-action-label">Xếp tự động</span></span></span>
                </button>
            </div>
        </div>
    </div>
    <!-- Bulk schedule action stays visible even when the unscheduled-tray panel is removed.
         Do not move this into #scheduleGrid: renderSchedule() replaces that element. -->
    <div class="schedule-bulk-actions" style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:-8px 0 16px;max-width:100%;">
        <button type="button" id="returnAllToTrayBtn" class="btn ghost"
            style="display:inline-flex;align-items:center;justify-content:center;gap:8px;max-width:100%;min-height:40px;"
            title="Đưa toàn bộ tiết chưa cố định về khay, giữ nguyên tiết đã ghim/cố định"
            aria-label="Đưa toàn bộ tiết chưa cố định về khay"
            onclick="returnAllToTray(this)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 11a9 9 0 1 1 2.6 6.4"/>
                <path d="M3 4v7h7"/>
            </svg>
            Đưa toàn bộ về khay
        </button>
    </div>
    <div class="print-schedule-header" aria-hidden="true">
        <div class="print-school-name">{{ p.school_name }}</div>
        <h1>THỜI KHÓA BIỂU</h1>
        <div class="print-schedule-meta">
            <span>Dự án: <b>{{ p.name }}</b></span>
            <span>Áp dụng từ ngày: ...... / ...... / ........</span>
        </div>
    </div>
    <div id="assignmentCoverage"></div>
    <section id="scheduleAttemptDetails" class="schedule-attempt-details" hidden aria-live="polite"></section>
    <!-- Compact, expandable unscheduled lessons pool; it remains visible as a summary even when collapsed. -->
    <details id="manualTrayDisclosure" class="manual-tray-panel compact-tray-panel">
        <summary class="compact-tray-summary">
            <span class="compact-tray-title">Kho tiết chưa xếp</span>
            <span id="unscheduledTrayCount" class="compact-tray-count" aria-live="polite">Đang tải số tiết...</span>
            <span class="compact-tray-chevron" aria-hidden="true"></span>
        </summary>
        <div id="unscheduledTray" class="unscheduled-tray" aria-label="Danh sách các tiết chưa xếp"></div>
    </details>
    <div class="schedule-highlight-toolbar" role="search" aria-label="Tìm và tô sáng tiết học">
        <label for="scheduleHighlightQuery">Tìm &amp; tô sáng tiết học</label>
        <div class="schedule-highlight-input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="scheduleHighlightQuery" type="search" autocomplete="off"
                placeholder="Nhập lớp, giáo viên hoặc môn..." aria-describedby="scheduleHighlightCount">
            <button type="button" id="scheduleHighlightClear" class="schedule-highlight-clear"
                onclick="clearScheduleHighlight()" aria-label="Xóa tìm kiếm" title="Xóa tìm kiếm" hidden>×</button>
        </div>
        <span id="scheduleHighlightCount" class="schedule-highlight-status" aria-live="polite">Tìm theo lớp, giáo viên hoặc môn; các tiết khác sẽ chỉ mờ đi.</span>
    </div>
    <div id="scheduleGrid"></div>
    <div class="print-approval" aria-hidden="true">
        <div>
            <b>NGƯỜI LẬP BIỂU</b>
            <span>(Ký và ghi rõ họ tên)</span>
        </div>
        <div>
            <b>BAN GIÁM HIỆU</b>
            <span>(Ký duyệt, đóng dấu)</span>
        </div>
    </div>
</section>
