<section id="constraints" class="tab">
    <div class="section-head">
        <div>
            <h1>Ngày nghỉ / tiết tránh</h1>
            <p>
                <b>Lưu ý:</b> <b>Tiết tránh</b> áp dụng cho giáo viên/lớp đang chọn. Nhãn <b>Khóa khối</b> áp dụng cho các lớp thuộc khối tương ứng.
            </p>
        </div>
    </div>
    <div class="constraint-toolbar">
        <select id="constraintType">
            <option value="teacher">Giáo viên</option>
            <option value="class">Lớp</option>
        </select>
        <select id="constraintEntity"></select>
        <button class="btn btn-danger" type="button" onclick="resetConstraintSection('entity',this)">Reset tiết tránh</button>
        <button class="btn" onclick="saveConstraints(this)">Lưu ràng buộc</button>
    </div>
    <div id="constraintGrid"></div>
</section>
