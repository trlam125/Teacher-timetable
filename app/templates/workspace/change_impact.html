<div class="project-edit-toolbar">
    <label class="project-edit-toggle">
        <input id="postScheduleEditToggle" type="checkbox" role="switch" onchange="savePostScheduleEditing(this.checked)"{% if post_schedule_editing %} checked{% endif %}>
        <span class="project-edit-toggle-track" aria-hidden="true"></span>
        <span>Chỉnh sửa sau xếp lịch</span>
        <span id="postScheduleEditState" aria-hidden="true">{{ 'Bật' if post_schedule_editing else 'Tắt' }}</span>
    </label>
    <button id="resumeEntityEditAction" type="button" class="btn ghost" onclick="resumeEntityEdit()" hidden>Quay lại bản nháp</button>
    <button type="button" class="btn ghost" onclick="openProjectChangeHistory()">Lịch sử &amp; sao lưu</button>
</div>
<dialog id="changeImpactDialog" class="change-impact-dialog" aria-labelledby="changeImpactTitle">
    <div class="change-impact-content">
        <h2 id="changeImpactTitle">Xem trước ảnh hưởng</h2>
        <div id="changeImpactBody" aria-live="polite"></div>
        <p id="changeImpactStatus" role="status"></p>
        <div class="row end change-impact-actions">
            <button class="btn ghost" id="changeImpactCancel" type="button">Quay lại chỉnh sửa</button>
            <button class="btn ghost" id="changeImpactRecalculate" type="button">Tính lại ảnh hưởng</button>
            <button class="btn" id="changeImpactApply" type="button">Áp dụng thay đổi</button>
        </div>
    </div>
</dialog>
<dialog id="projectChangeHistoryDialog" class="change-impact-dialog project-change-history-dialog" aria-labelledby="projectChangeHistoryTitle">
    <div class="change-impact-content project-change-history-content">
        <header class="project-change-history-header">
            <h2 id="projectChangeHistoryTitle">Lịch sử &amp; sao lưu</h2>
            <button class="btn ghost" type="button" autofocus onclick="this.closest('dialog').close()">Đóng</button>
        </header>
        <div class="project-change-history-scroll" tabindex="0" role="region" aria-label="Danh sách lịch sử chỉnh sửa">
            <p>Chỉ có thể hoàn tác thay đổi gần nhất khi chưa có chỉnh sửa mới.</p>
            <div id="projectChangeHistoryBody" aria-live="polite"></div>
        </div>
    </div>
</dialog>
