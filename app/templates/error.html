<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ title }} · Smart TKB</title>
    <link rel="icon" type="image/svg+xml" href="/static/brand-logo.svg?v=1">
    <script src="/static/error-page.js?v=1"></script>
    <link rel="stylesheet" href="/static/design-tokens.css?v=1">
    <link rel="stylesheet" href="/static/error-page.css?v=1">
</head>
<body>
    <header class="error-header">
        <a class="error-brand" href="/" aria-label="Smart TKB — Trang chủ">
            <img src="/static/brand-logo.svg?v=1" width="36" height="36" alt="">
            <span>Smart TKB</span>
        </a>
        <span class="error-header-note">Trợ lý xếp lịch cho nhà trường</span>
    </header>
    <main class="error-main">
        <section class="error-card" aria-labelledby="error-title" aria-describedby="error-description">
            <div class="error-art" aria-hidden="true">
                <span class="error-number">{{ status_code }}</span>
                <div class="error-icon">
                    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        {% if status_code == 403 %}
                        <rect x="14" y="27" width="36" height="29" rx="7"/>
                        <path d="M22 27V19a10 10 0 0 1 20 0v8M32 39v6"/>
                        {% elif status_code == 404 %}
                        <rect x="8" y="12" width="40" height="38" rx="7"/>
                        <path d="M18 7v10M38 7v10M8 24h40M18 33h6M18 41h4"/>
                        <circle cx="43" cy="43" r="11" class="error-search"/>
                        <path d="m51 51 7 7"/>
                        {% else %}
                        <path d="m27 12-20 35a6 6 0 0 0 5 9h40a6 6 0 0 0 5-9L37 12a6 6 0 0 0-10 0Z"/>
                        <path d="M32 25v12M32 46h.01"/>
                        {% endif %}
                    </svg>
                </div>
            </div>
            <span class="error-status">Lỗi {{ status_code }} · {{ 'Truy cập bị giới hạn' if status_code == 403 else 'Trang không khả dụng' }}</span>
            <h1 id="error-title">{{ title }}</h1>
            <p id="error-description" class="error-description">{{ description }}</p>
            <p class="error-hint">{{ hint }}</p>
            <nav class="error-actions" aria-label="Điều hướng khi gặp lỗi">
                <a class="error-button error-button-primary" href="/">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
                    Về trang chủ
                </a>
                <button class="error-button error-button-secondary" id="error-back" type="button" hidden>
                    <span aria-hidden="true">←</span> Quay lại
                </button>
            </nav>
        </section>
        <p class="error-footer">Smart TKB · Sắp xếp lịch học, kết nối nhà trường.</p>
    </main>
</body>
</html>
