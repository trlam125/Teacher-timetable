name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: smart_tkb_auth_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check application syntax
        run: python -m compileall -q app
      - name: Run offline regression tests
        if: ${{ hashFiles('tests/**/test*.py') != '' }}
        env:
          AUTH_TEST_DATABASE_URL: postgresql+psycopg://auth_test:disposable-ci-password@127.0.0.1:5432/smart_tkb_auth_tests
        run: python -m unittest discover -s tests -v
      - name: Report missing regression tests
        if: ${{ hashFiles('tests/**/test*.py') == '' }}
        run: |
          echo "::notice::No test*.py files found under tests/; regression tests skipped."
          echo "Regression tests skipped: this checkout contains no test*.py files under tests/." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: find app/static vercel-launcher netlify-mail-proxy -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Build and test Studio browser exporter
        working-directory: web/ai-slides
        run: |
          npm ci --ignore-scripts
          npm test
          npm run spike
          npm run build
          git diff --exit-code -- ../../app/static/ai-slides/dist
      - name: Install headless test dependencies
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Check Studio flows in headless Chromium
        run: |
          python tests/studio_preview_server.py &
          STUDIO_TEST_PID=$!
          trap 'kill "$STUDIO_TEST_PID" || true' EXIT
          python tests/studio_headless.py
          python tests/studio_editor_headless.py
