name: Build Teacher Timetable APK

on:
  # Automatically build after pushing to the main or master branch.
  push:
    branches:
      - main
      - master

  # Allow manual builds from GitHub Actions.
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older build on the same branch when a newer push arrives.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # The project has no gradle-wrapper.jar, so install Gradle directly.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Validate website URL
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [[ ! "$APP_BASE_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::Set repository secret APP_BASE_URL to the deployed HTTPS website URL."
            exit 1
          fi

      - name: Build debug APK
        working-directory: android-webview
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Teacher-Timetable-Debug-APK
          path: android-webview/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
